spring.application.name=billingsoftware
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/api/v1.0

aws.access.key=${AWS_ACCESS}
aws.secret.key=${AWS_SECRET}
aws.region=${AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}

jwt.secret.key=${JWT_SECRET}
jwt.access-token.expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
auth.refresh-token.cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
auth.refresh-token.cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
auth.refresh-token.cookie-path=${AUTH_REFRESH_COOKIE_PATH:/api/v1.0}

payos.client.id=${PAYOS_CLIENT}
payos.api.key=${PAYOS_API}
payos.checksum.key=${PAYOS_CHECKSUM}
logging.level.org.springframework.web=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always

